services:
  - type: web
    name: stock-transformer-api
    env: python
    plan: free
    buildCommand: "pip install --index-url https://download.pytorch.org/whl/cpu torch --extra-index-url https://pypi.org/simple -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
